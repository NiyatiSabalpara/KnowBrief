version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_news_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/exports:/app/exports
    environment:
      - DATABASE_URL=sqlite:////app/data/knowledge_base.db
      - REQUEST_TIMEOUT_SECONDS=15
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 6

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai_news_frontend
    ports:
      - "5173:80"
    environment:
      - BACKEND_URL=http://backend:8000/api/
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_news_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/exports:/app/exports
    environment:
      - DATABASE_URL=sqlite:////app/data/knowledge_base.db
      - REQUEST_TIMEOUT_SECONDS=15
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai_news_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
